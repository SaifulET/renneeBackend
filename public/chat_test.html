<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Test</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .config-box {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            background: #f9f9f9;
        }

        .input-group {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }

        input {
            padding: 5px;
            width: 300px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
        }

        button:hover {
            background: #0056b3;
        }

        #chat-area {
            display: none;
            margin-top: 20px;
        }

        #messages {
            border: 1px solid #ddd;
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            background: white;
        }

        .message {
            margin-bottom: 8px;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .message.sent {
            background: #e3f2fd;
            text-align: right;
            margin-left: auto;
            width: fit-content;
        }

        .message.received {
            background: #f1f1f1;
            text-align: left;
            margin-right: auto;
            width: fit-content;
        }

        .system-msg {
            color: #888;
            font-style: italic;
            text-align: center;
            font-size: 0.9em;
            margin: 5px 0;
        }

        .status {
            margin-left: 10px;
            font-weight: bold;
        }

        .status.connected {
            color: green;
        }

        .status.disconnected {
            color: red;
        }
    </style>
</head>

<body>

    <h2>Socket.IO Chat Test</h2>

    <!-- Connection Config -->
    <div class="config-box">
        <h3>1. Configuration</h3>
        <div class="input-group">
            <label>Server URL:</label>
            <input type="text" id="serverUrl" value="http://localhost:5000">
        </div>
        <div class="input-group">
            <label>Conversation ID:</label>
            <input type="text" id="conversationId" value="6985233924886c66d447f144" placeholder="Enter Conversation ID">
        </div>
        <div class="input-group">
            <label>Sender ID (Me):</label>
            <input type="text" id="senderId" value="69827149c64b011d4f5d17ef" placeholder="My User ID">
        </div>
        <div class="input-group">
            <label>Receiver ID:</label>
            <input type="text" id="receiverId" value="69790f314d6217d841e7ee84" placeholder="Partner User ID">
        </div>
        <button onclick="connectAndJoin()">Connect & Join</button>
        <span id="connectionStatus" class="status disconnected">Disconnected</span>
    </div>

    <!-- Chat Interface -->
    <div id="chat-area">
        <h3>2. Chat Room</h3>
        <div id="messages"></div>
        <div class="input-group" style="display: flex; gap: 10px;">
            <input type="text" id="messageInput" placeholder="Type a message..." style="flex-grow: 1;">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let socket;
        let currentConversationId = "";

        function connectAndJoin() {
            const serverUrl = document.getElementById('serverUrl').value;
            currentConversationId = document.getElementById('conversationId').value;
            const senderId = document.getElementById('senderId').value;

            if (!serverUrl || !currentConversationId) {
                alert("Please enter Server URL and Conversation ID");
                return;
            }

            if (socket && socket.connected) {
                socket.disconnect();
            }

            // Connect
            socket = io(serverUrl);

            socket.on('connect', () => {
                document.getElementById('connectionStatus').textContent = "Connected";
                document.getElementById('connectionStatus').className = "status connected";
                addSystemMessage("Connected to server.");

                // Join Room
                console.log("Joining conversation:", currentConversationId, "as", senderId);
                socket.emit('join_conversation', {
                    conversationid: currentConversationId,
                    myuserid: senderId
                });
            });

            socket.on('disconnect', () => {
                document.getElementById('connectionStatus').textContent = "Disconnected";
                document.getElementById('connectionStatus').className = "status disconnected";
                addSystemMessage("Disconnected from server.");
            });

            // Handle Join Confirmation
            socket.on('join_confirmation', (data) => {
                console.log("Joined:", data);
                addSystemMessage(`Joined room: ${data.conversationId}`);
                document.getElementById('chat-area').style.display = "block";
            });

            // Handle Incoming Messages
            socket.on('receive_message', (message) => {
                console.log("Received:", message);
                // Determine if it's sent by me or received
                // Note: The structure of 'message' depends on your backend schema. 
                // Adjust per your IMessage interface.
                const isMine = message.senderId === document.getElementById('senderId').value;
                addMessage(message.text || "Image/Attachment", isMine ? 'sent' : 'received');
            });

            socket.on('error', (err) => {
                console.error("Socket Error:", err);
                addSystemMessage("Error: " + (err.message || "Unknown error"));
            });
        }

        function sendMessage() {
            const text = document.getElementById('messageInput').value;
            const senderId = document.getElementById('senderId').value;
            const receiverId = document.getElementById('receiverId').value;

            if (!text || !senderId) {
                alert("Text and Sender ID are required");
                return;
            }

            const payload = {
                conversationId: currentConversationId,
                senderId: senderId,
                receiverId: receiverId,
                text: text,
                images: [] // Add image logic if needed
            };

            //new raju vai

            // Emit to server
            // Server should persist and then emit 'receive_message' back
            socket.emit('send_message', payload);

            document.getElementById('messageInput').value = "";
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            document.getElementById('messages').appendChild(div);
            // Auto scroll
            const messagesContainer = document.getElementById('messages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'system-msg';
            div.textContent = text;
            document.getElementById('messages').appendChild(div);
        }
    </script>
</body>

</html>
